# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom 1.18 支持配置缓存；若遇到与配置缓存相关的问题，可把下面这行改为 false
org.gradle.configuration-cache=true

# Fabric Properties
# 版本对照：https://fabricmc.net/develop
# 注意：Yarn 目前没有 26.3 的映射（meta.fabricmc.net/v2/versions/yarn/26.3 返回空），
# 因此 Loom 1.18 默认使用 Mojang 官方映射，模板中也因此不再声明 mappings 行。
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# 本机网络：Maven 仓库需要经过本地代理访问，直连会失败。
# 代理**不要写在这个文件里** —— 它会被提交，CI 上并没有 127.0.0.1:7890 这个代理，
# 于是每次 push 都会看到 "Connection refused" 的构建失败（2026-10-02 修）。
# 请改写到用户级配置（不入版本库）里：
#   ~/.gradle/gradle.properties
#     systemProp.https.proxyHost=127.0.0.1
#     systemProp.https.proxyPort=7890
#     systemProp.http.proxyHost=127.0.0.1
#     systemProp.http.proxyPort=7890

# Mod Properties
version=1.0.0
group=com.cyx.crimsoncoppergrid
archives_base_name=crimsoncoppergrid

# Dependencies
fabric_api_version=0.161.0+26.3
# Team Reborn Energy —— 与 TechReborn 同一套能量 API。经 maven.fabricmc.net 解析
# （该仓库由 Loom 自动注入，因此这里不需要额外声明 repositories）。
energy_version=5.0.0
